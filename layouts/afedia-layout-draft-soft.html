<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Afedia — soft/intimate draft v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Corinthia:wght@400;700&family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF6F1;
    --ink:#332A26;
    --muted:#A4948A;
    --blue:#7C93B5;
    --blue-deep:#5C7690;
    --frame:#FFFFFF;
    --frame-shadow:rgba(51,42,38,0.12);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter",sans-serif;line-height:1.75;}
  .center{max-width:600px;margin:0 auto;text-align:center;padding:0 6vw;}
  header{padding:2.5rem 6vw 0.5rem;text-align:center;}
  .wordmark{font-family:"Corinthia",cursive;font-size:4.4rem;color:var(--blue);}

  .hero{padding:2rem 6vw 4rem;text-align:center;}
  .polaroid{
    display:inline-block;
    background:var(--frame);
    padding:14px 14px 40px;
    box-shadow:0 10px 24px var(--frame-shadow);
    transform:rotate(-2deg);
    margin-bottom:1.5rem;
  }
  .polaroid .ph{width:280px;aspect-ratio:4/5;background:#EFE6DC;display:flex;align-items:center;justify-content:center;color:var(--muted);font-style:italic;font-size:12px;text-align:center;padding:1rem;}
  .hero h1{
    font-family:"Corinthia",cursive;
    font-size:5rem;
    margin:0 0 0.3rem;
    color:var(--blue);
  }
  .hero p{color:var(--muted);font-size:1rem;margin:0;}

  .about{padding:2rem 6vw 4rem;}
  .about p.eyebrow{font-family:"Corinthia",cursive;font-size:2.6rem;color:var(--blue);margin:0 0 1rem;}
  .about p{max-width:48ch;margin:0 auto 0.8rem;}

  .gallery{padding:1rem 6vw 4rem;}
  .gallery h2{font-family:"Fraunces",serif;font-weight:400;font-size:1.8rem;text-align:center;margin:0 0 2.5rem;}
  .scatter{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:3.5rem 3rem;
    max-width:760px;
    margin:0 auto;
    justify-items:center;
  }
  .scatter .polaroid{padding:16px 16px 44px;margin:0;width:100%;max-width:340px;}
  .scatter .polaroid .ph{width:100%;aspect-ratio:4/5;font-size:12px;}
  .scatter .polaroid:nth-child(1){transform:rotate(-3deg);}
  .scatter .polaroid:nth-child(2){transform:rotate(2deg) translateY(10px);}
  .scatter .polaroid:nth-child(3){transform:rotate(-1.5deg) translateY(-6px);}
  .scatter .polaroid:nth-child(4){transform:rotate(3deg) translateY(14px);}
  .scatter .polaroid:nth-child(5){transform:rotate(-2.5deg);}
  @media (max-width:640px){
    .scatter{grid-template-columns:1fr;max-width:340px;}
  }

  footer{text-align:center;padding:2.5rem 6vw 3rem;color:var(--muted);font-size:0.85rem;}
  footer p{margin:0 0 1rem;}
  .connect-trigger{
    background:none;border:none;cursor:pointer;
    font-family:"Inter",sans-serif;font-size:0.78rem;letter-spacing:0.06em;text-transform:uppercase;
    color:var(--blue);padding:0.5rem 1rem;border:1px solid var(--blue);border-radius:999px;
  }
  .connect-trigger:hover{background:var(--blue);color:var(--bg);}

  .modal-backdrop{
    display:none;position:fixed;inset:0;background:rgba(51,42,38,0.35);
    align-items:center;justify-content:center;padding:6vw;z-index:50;
  }
  .modal-backdrop.open{display:flex;}
  .modal{
    background:var(--bg);border-radius:16px;padding:2.5rem 2rem;text-align:center;
    box-shadow:0 20px 40px rgba(51,42,38,0.2);max-width:320px;width:100%;position:relative;
  }
  .modal-close{
    position:absolute;top:0.8rem;right:1rem;background:none;border:none;font-size:1.3rem;
    color:var(--muted);cursor:pointer;line-height:1;
  }
  .modal p.title{font-family:"Fraunces",serif;font-style:italic;font-size:1.1rem;margin:0 0 1.5rem;color:var(--ink);}
  .icon-row{display:flex;justify-content:center;gap:1.5rem;}
  .icon-row a{
    width:44px;height:44px;border-radius:50%;border:1px solid var(--blue);
    display:flex;align-items:center;justify-content:center;color:var(--blue);text-decoration:none;
    transition:background 0.2s,color 0.2s;
  }
  .icon-row a:hover{background:var(--blue);color:var(--bg);}
  .icon-row svg{width:20px;height:20px;}
</style>
</head>
<body>
  <header><div class="wordmark">Afedia</div></header>

  <section class="hero">
    <div class="polaroid"><div class="ph">photograph — portrait</div></div>
    <h1>Glory</h1>
    <p>A little corner of the internet, built around one favorite person.</p>
  </section>

  <section class="about center">
    <p class="eyebrow">A few words</p>
    <p>Quick to laugh. Quicker to notice when something's beautiful.</p>
    <p>Always chasing good light for a photo of her own.</p>
  </section>

  <section class="gallery">
    <h2>A few of my favorites</h2>
    <div class="scatter">
      <figure class="polaroid"><div class="ph">photo</div></figure>
      <figure class="polaroid"><div class="ph">photo</div></figure>
      <figure class="polaroid"><div class="ph">photo</div></figure>
      <figure class="polaroid"><div class="ph">photo</div></figure>
    </div>
  </section>

  <footer>
    <p>A small site, made with care.</p>
    <button class="connect-trigger" onclick="document.getElementById('connectModal').classList.add('open')">Connect</button>
  </footer>

  <div class="modal-backdrop" id="connectModal">
    <div class="modal">
      <button class="modal-close" onclick="document.getElementById('connectModal').classList.remove('open')">&times;</button>
      <p class="title">Find her here</p>
      <div class="icon-row">
        <a href="#" aria-label="Instagram">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.8" fill="currentColor" stroke="none"/></svg>
        </a>
        <a href="#" aria-label="TikTok">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 12a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/><path d="M15 8a4 4 0 0 0 4 4V4h-4"/><line x1="15" y1="4" x2="15" y2="12"/></svg>
        </a>
        <a href="#" aria-label="Facebook">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
        </a>
      </div>
    </div>
  </div>
</body>
</html>
